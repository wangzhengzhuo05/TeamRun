services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teamrun
      POSTGRES_USER: teamrun
      POSTGRES_PASSWORD: teamrun
    ports:
      - '5432:5432'
    volumes:
      - teamrun-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamrun']
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: teamrun
      MINIO_ROOT_PASSWORD: teamrun-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - teamrun-minio:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-port 8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: teamrun-admin
    ports:
      - '8180:8180'

volumes:
  teamrun-postgres:
  teamrun-minio:
